 .clear-app, .clear-app * {
  box-sizing: border-box;
 
}

.clear-app button {
  font: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
 
}
.clear-app {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  font-family: Arial, Helvetica, sans-serif;
  font-synthesis: auto;
  color: #111;
  overflow: hidden;
  background: #f5f3e9;
  isolation: isolate;
 
}
.clear-app .grid-plane {
  position: absolute;
  inset: 4px;
 
}
.clear-app .tile {
  position: absolute;
  background: var(--surface);
  border: 1px solid #f5f3e9;
  padding: 0;
  border-radius: 0;
  overflow: hidden;
  container-type: size;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-origin: 0 0;
  contain: layout paint style;
 
}
.clear-app .face {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  overflow: hidden;
 
}
.clear-app .word {
  display: block;
  font-size: min(var(--fit), 105cqh);
  line-height: .8;
  font-weight: 700;
  letter-spacing: -.075em;
  white-space: nowrap;
  pointer-events: none;
 
}
.clear-app .vertical .word {
  writing-mode: vertical-rl;
  text-orientation: mixed;
  font-size: min(var(--fit), 112cqw);
 
}
.clear-app .treatment-1 .word {
  font-variation-settings: 'wght' 700, 'MONO' 0, 'slnt' 0;
